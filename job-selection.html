<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101c25">
  <title>WORD FALL QUEST | 職業選択</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Noto Sans JP", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:#0b151c;
      color:#edf4ee;
    }
    * { box-sizing:border-box; }
    body {
      min-height:100vh;
      margin:0;
      padding:24px 14px calc(24px + env(safe-area-inset-bottom));
      display:grid;
      place-items:center;
      background:
        radial-gradient(ellipse at 50% 0%,rgba(78,143,111,.22),transparent 34rem),
        linear-gradient(155deg,#101f28,#0b151c 70%);
    }
    main { width:min(100%,560px); }
    .eyebrow { color:#8bd4aa;font-size:.66rem;font-weight:950;letter-spacing:.18em; }
    h1 { margin:7px 0 8px;font-size:clamp(1.7rem,6vw,2.3rem);letter-spacing:.04em; }
    .intro { margin:0 0 20px;color:#a9bbb7;font-size:.86rem;line-height:1.8; }
    #jobOptions { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px; }
    .job-card {
      display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:start;
      min-width:0;padding:13px;border:1px solid #405d53;border-radius:14px;
      background:linear-gradient(145deg,rgba(30,58,52,.97),rgba(17,35,39,.98));
      box-shadow:0 9px 22px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.05);
    }
    .job-card.selected { border-color:#8bd4aa;box-shadow:0 0 0 1px rgba(139,212,170,.25),0 9px 22px rgba(0,0,0,.2); }
    .job-icon {
      display:grid;place-items:center;width:48px;height:48px;border:1px solid #567d67;
      border-radius:12px;background:#2c5744;font-size:1.55rem;
    }
    .job-copy { min-width:0; }
    .job-copy h2 { margin:0 0 4px;font-size:1.18rem; }
    .job-title { color:#d9c38f;font-size:.72rem;font-weight:850; }
    .job-description { margin:8px 0 0;color:#bfd0c7;font-size:.76rem;line-height:1.6; }
    .job-strength { margin:7px 0 0;color:#9cdbb2;font-size:.69rem;font-weight:850; }
    .job-badge {
      grid-column:1/-1;justify-self:start;padding:4px 8px;border:1px solid #63866a;
      border-radius:99px;background:#1d493b;color:#d7f1db;font-size:.62rem;font-weight:900;
    }
    .choose-job {
      grid-column:1/-1;width:100%;min-height:39px;padding:8px 10px;
      border:1px solid #567b67;border-radius:9px;background:#203f35;
      color:#e9f7eb;font-size:.76rem;font-weight:900;
    }
    .choose-job[aria-pressed="true"] { border-color:#8bd4aa;background:#2d7854; }
    .confirm {
      width:100%;min-height:50px;margin-top:13px;padding:11px 16px;
      border:1px solid #76c695;border-radius:11px;
      background:linear-gradient(180deg,#338d61,#236c4c);
      color:#f4fff6;font-size:.9rem;font-weight:950;
      box-shadow:0 6px 17px rgba(15,83,54,.25);
    }
    .confirm:disabled { opacity:.55; }
    .status { min-height:1.5em;margin:10px 2px 0;color:#e6c98d;font-size:.72rem;line-height:1.5; }
    .note {
      margin:16px 2px 0;padding-top:13px;border-top:1px solid #293d40;
      color:#849a96;font-size:.68rem;line-height:1.8;
    }
    @media(max-width:390px) {
      body { padding-inline:11px; }
      #jobOptions { gap:8px; }
      .job-card { grid-template-columns:40px minmax(0,1fr);gap:8px;padding:10px; }
      .job-icon { width:40px;height:40px;font-size:1.35rem; }
      .job-copy h2 { font-size:1rem; }
      .job-description { font-size:.7rem; }
      .job-strength { font-size:.65rem; }
    }
    @media(max-width:340px) {
      #jobOptions { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">ADVENTURER REGISTRATION</div>
    <h1>最初の職業を選ぼう</h1>
    <p class="intro">4つの職業から1つを選ぼう。選んだ職業に対応する戦闘スタイルも設定されるよ。</p>
    <section id="jobOptions" aria-label="選べる職業"></section>
    <button class="confirm" id="confirmJob" type="button" disabled>職業を選択してください</button>
    <p class="status" id="jobStatus" role="status" aria-live="polite"></p>
    <p class="note">職業ごとの専用スキルや能力は、今後のアップデートでさらに充実させていくよ。</p>
  </main>
  <script type="module" src="./src/job-selection-page.js"></script>
</body>
</html>
