<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09121b">
<title>WORD FALL QUEST | 冒険者ホーム</title>
<link rel="stylesheet" href="./src/shared-layout.css">
<style>
  body[data-wfq-page="index.html"] .wfq-content {
    padding:12px 14px 30px;
  }
  body[data-wfq-page="index.html"] #homePage {
    width:min(100%,760px);
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:13px;
  }
  #homePage .home-heading {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  #homePage .home-heading h1 {
    margin:2px 0 0;
    color:#f1f6f1;
    font-size:clamp(1.25rem,4vw,1.8rem);
    line-height:1.15;
  }
  #homePage .home-heading .eyebrow {
    color:#73c6a2;
    font-size:.59rem;
    font-weight:900;
    letter-spacing:.15em;
  }
  #homePage .home-town-label {
    padding:6px 9px;
    border:1px solid #415b50;
    border-radius:7px;
    background:#152a27;
    color:#c9b37e;
    font-size:.66rem;
    font-weight:850;
    white-space:nowrap;
  }

  #homePage .home-player-panel {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    min-width:0;
    padding:9px 11px;
    border:1px solid #304653;
    border-radius:11px;
    background:linear-gradient(145deg,#172c39,#11212c);
    box-shadow:0 5px 16px rgba(0,0,0,.16);
  }
  #homePage .home-player {
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
  }
  #homePage .avatar {
    display:grid;
    place-items:center;
    flex:0 0 42px;
    width:42px;
    height:42px;
    overflow:hidden;
    border:1px solid #456778;
    border-radius:10px;
    background:linear-gradient(145deg,#1e4168,#14243b);
  }
  #homePage .avatar img {
    display:block;
    width:100%;
    height:100%;
    padding:0;
    object-fit:contain;
  }
  #homePage .home-player-copy {
    display:grid;
    gap:3px;
    min-width:0;
  }
  #homePage .home-player-copy strong {
    color:#edf4f1;
    font-size:.8rem;
    white-space:nowrap;
  }
  #homePage .home-player-copy small {
    color:#9aadb3;
    font-size:.62rem;
    line-height:1.3;
  }
  #homePage .wallet {
    display:flex;
    flex:0 0 auto;
    flex-wrap:nowrap;
    justify-content:flex-end;
    gap:5px;
  }
  #homePage .stat {
    padding:6px 8px;
    border:1px solid #304653;
    border-radius:8px;
    background:#101f2a;
    color:#c8d5d0;
    font-size:.65rem;
    white-space:nowrap;
  }
  #homePage .stat strong { color:#f0d18c; }

  #homePage .home-destinations { margin:0; padding:0; }
  #homePage .home-section-heading {
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
    margin:0 2px 9px;
  }
  #homePage .home-section-heading h2 {
    margin:0;
    color:#e9f1eb;
    font-size:.93rem;
  }
  #homePage .home-section-heading span {
    color:#77958b;
    font-size:.55rem;
    font-weight:900;
    letter-spacing:.13em;
  }
  #homePage .home-choice-grid {
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
  }
  #homePage .home-choice-card {
    position:relative;
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
    min-height:76px;
    padding:10px;
    overflow:hidden;
    border:1px solid #34505b;
    border-radius:11px;
    background:linear-gradient(145deg,#1b3040,#142532);
    color:#f0f5ef;
    text-decoration:none;
    box-shadow:0 5px 15px rgba(0,0,0,.16);
    transition:transform .16s ease,border-color .16s ease,filter .16s ease;
  }
  #homePage .home-choice-card:hover {
    transform:translateY(-2px);
    border-color:#62a98a;
    filter:brightness(1.08);
  }
  #homePage .home-choice-icon {
    display:grid;
    place-items:center;
    flex:0 0 38px;
    width:38px;
    height:38px;
    border-radius:10px;
    background:#243c42;
    color:#e5c37c;
    font-size:1.35rem;
  }
  #homePage .home-choice-copy {
    display:grid;
    gap:3px;
    min-width:0;
  }
  #homePage .home-choice-copy strong {
    color:#f1f5ef;
    font-size:.79rem;
    line-height:1.2;
  }
  #homePage .home-choice-copy small {
    color:#9aadb3;
    font-size:.61rem;
    line-height:1.35;
  }
  #homePage .home-choice-arrow {
    margin-left:auto;
    color:#d7bd83;
    font-size:1.3rem;
  }

  #homePage .home-choice-featured {
    grid-column:1/-1;
    min-height:88px;
    padding:13px 15px;
    border-color:#477a6b;
    background:
      radial-gradient(circle at 86% 50%,rgba(112,204,153,.14),transparent 9rem),
      linear-gradient(115deg,#205747,#17323a 72%);
  }
  #homePage .home-choice-featured .home-choice-icon {
    flex-basis:48px;
    width:48px;
    height:48px;
    border:1px solid rgba(169,221,185,.24);
    border-radius:12px;
    background:#245b4a;
    color:#f2d58e;
    font-size:1.7rem;
  }
  #homePage .home-choice-featured .home-choice-copy strong {
    color:#f5f8ee;
    font-size:.95rem;
  }
  #homePage .home-choice-featured .home-choice-copy small {
    color:#b7d0c4;
    font-size:.66rem;
  }
  #homePage .home-choice-featured .home-choice-arrow {
    color:#f0d18c;
    font-size:1.65rem;
  }
  #homePage .home-choice-skills .home-choice-icon {
    background:#453a6d;
    color:#e2d5ff;
  }
  #homePage .home-choice-shop .home-choice-icon { background:#4a3c2b; }
  #homePage .home-choice-forge .home-choice-icon { background:#463633; }
  #homePage .home-choice-character .home-choice-icon { background:#493b2f; color:#f4d18a; }

  @media(max-width:820px) {
    body[data-wfq-page="index.html"] .wfq-content {
      padding:8px 9px calc(88px + env(safe-area-inset-bottom));
    }
    body[data-wfq-page="index.html"] #homePage { gap:9px; }
    #homePage .home-choice-grid { gap:8px; }
    #homePage .home-choice-card { min-height:70px; }
    #homePage .home-choice-featured { min-height:80px; }
  }
  @media(max-width:380px) {
    #homePage .home-player-panel { gap:5px; padding:7px; }
    #homePage .home-player { gap:6px; }
    #homePage .avatar { flex-basis:36px; width:36px; height:36px; }
    #homePage .home-player-copy small { display:none; }
    #homePage .stat { padding:5px 6px; font-size:.59rem; }
    #homePage .home-choice-card { min-height:68px; padding:8px; gap:7px; }
    #homePage .home-choice-icon { flex-basis:32px; width:32px; height:32px; font-size:1.15rem; }
    #homePage .home-choice-copy strong { font-size:.72rem; }
    #homePage .home-choice-copy small { font-size:.57rem; }
    #homePage .home-choice-featured { min-height:74px; padding:9px; }
    #homePage .home-choice-featured .home-choice-icon {
      flex-basis:40px; width:40px; height:40px; font-size:1.45rem;
    }
  }
  @media(prefers-reduced-motion:reduce) {
    #homePage .home-choice-card { transition:none; }
  }
</style>
</head>
<body>
<main id="homePage" aria-label="冒険者ホーム">
  <div class="home-heading">
    <div>
      <div class="eyebrow">WELCOME TO THE TOWN</div>
      <h1>冒険者ギルド</h1>
    </div>
    <span class="home-town-label">はじまりの町</span>
  </div>

  <section class="home-player-panel" aria-label="冒険者の情報">
    <div class="home-player">
      <div class="avatar"><img id="heroAvatar" alt="主人公" hidden></div>
      <div class="home-player-copy">
        <strong>冒険者 <span id="levelValue">LV.1</span></strong>
        <small id="currentCharacterLabel">轟剣士</small>
        <small id="heroMessage">次の冒険に向けて準備しよう。</small>
      </div>
    </div>
    <div class="wallet" aria-label="所持情報">
      <div class="stat" id="hpValue">HP 100 / 100</div>
      <div class="stat"><strong id="goldValue">0 G</strong></div>
    </div>
  </section>

  <section class="home-destinations" aria-labelledby="homeDestinationsTitle">
    <div class="home-section-heading">
      <h2 id="homeDestinationsTitle">次の行動を選ぼう</h2>
      <span>CHOOSE YOUR NEXT STEP</span>
    </div>
    <div class="home-choice-grid">
      <a class="home-choice-card home-choice-featured" href="./dungeons.html">
        <span class="home-choice-icon" aria-hidden="true">⚔️</span>
        <span class="home-choice-copy">
          <strong>冒険に出る</strong>
          <small>ダンジョンを選んで出発</small>
        </span>
        <span class="home-choice-arrow" aria-hidden="true">›</span>
      </a>
      <a class="home-choice-card home-choice-equipment" href="./inventory.html">
        <span class="home-choice-icon" aria-hidden="true">🛡️</span>
        <span class="home-choice-copy">
          <strong>装備を整える</strong>
          <small>装備・アイテムを確認</small>
        </span>
        <span class="home-choice-arrow" aria-hidden="true">›</span>
      </a>
      <a class="home-choice-card home-choice-skills" href="./skills.html">
        <span class="home-choice-icon" aria-hidden="true">✨</span>
        <span class="home-choice-copy">
          <strong>スキル工房</strong>
          <small>スキルを強化</small>
        </span>
        <span class="home-choice-arrow" aria-hidden="true">›</span>
      </a>
      <a class="home-choice-card home-choice-shop" href="./shop.html">
        <span class="home-choice-icon" aria-hidden="true">🛒</span>
        <span class="home-choice-copy">
          <strong>ショップ</strong>
          <small>武器や道具を購入</small>
        </span>
        <span class="home-choice-arrow" aria-hidden="true">›</span>
      </a>
      <a class="home-choice-card home-choice-forge" href="./crafting.html">
        <span class="home-choice-icon" aria-hidden="true">⚒️</span>
        <span class="home-choice-copy">
          <strong>鍛冶屋</strong>
          <small>素材から装備を作成</small>
        </span>
        <span class="home-choice-arrow" aria-hidden="true">›</span>
      </a>
      <a class="home-choice-card home-choice-character" href="./characters.html">
        <span class="home-choice-icon" aria-hidden="true">⚔️</span>
        <span class="home-choice-copy">
          <strong>キャラクター</strong>
          <small>4つの戦闘スタイルから選択</small>
        </span>
        <span class="home-choice-arrow" aria-hidden="true">›</span>
      </a>
    </div>
  </section>
</main>

<script type="module">
import { createAppSession } from "./src/app-session.js";
import { setCharacterImage } from "./src/character-images.js";

setCharacterImage(document.getElementById("heroAvatar"), "hero", {
  alt: "主人公",
  baseUrl: document.baseURI,
});

const session = createAppSession();
const { store, dungeon } = session;
const result = session.returnToTown();
const state = store.getState();

document.getElementById("levelValue").textContent = "LV." + state.player.level;
document.getElementById("hpValue").textContent = "HP " + state.player.hp + " / " + state.player.maxHp;
document.getElementById("goldValue").textContent = state.inventory.gold + " G";
document.getElementById("currentCharacterLabel").textContent = session.getSelectedCharacter().name + " ・戦闘スタイル";
document.getElementById("heroMessage").textContent = result.restoredHp > 0
  ? "ホームに戻ったのでHPが全回復したよ。"
  : "次の冒険に向けて準備しよう。";

window.WFQ_HOME_CONTEXT = {
  player: {
    level: state.player.level,
    hp: state.player.hp,
    maxHp: state.player.maxHp,
  },
  dungeonProgress: dungeon.getAllProgress(),
};

window.addEventListener("pagehide", () => session.save());
</script>
<script type="module" src="./src/shared-layout.js"></script>
</body>
</html>
