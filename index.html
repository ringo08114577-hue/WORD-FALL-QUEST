<head>

<title>WORD FALL QUEST | 冒険者ホーム</title>
<style>
    :root{color-scheme:dark;font-family:Inter,"Noto Sans JP",system-ui,sans-serif;background:#0b1220;color:#eef4ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:14px 10px 28px;background:radial-gradient(circle at 50% 0%,rgba(56,117,201,.23),transparent 38rem),#0b1220}
    main{width:min(100%,900px);margin:0 auto}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .eyebrow{font-size:.68rem;letter-spacing:.14em;font-weight:850;color:#7dd3fc}.back{color:#bfdbfe;text-decoration:none;font-size:.78rem;font-weight:800}
    h1{margin:7px 0 2px;font-size:clamp(1.6rem,5vw,2.3rem)}.subtitle{margin:0 0 14px;color:#9eacc2;font-size:.84rem;line-height:1.5}

    .facility-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}
    .facility-link{min-height:118px;padding:14px;border:1px solid #314662;border-radius:14px;background:linear-gradient(145deg,#1a2b43,#111d30);color:#eef4ff;text-decoration:none;display:flex;flex-direction:column;gap:7px}
    .facility-link:hover,.dungeon-card:hover,.floor-card:hover{border-color:#60a5fa}.facility-icon{font-size:1.65rem}.facility-link strong{font-size:.95rem}.facility-link small{color:#9eacc2;font-size:.72rem;line-height:1.4}
    .footer{margin-top:20px;text-align:center;color:#64748b;font-size:.68rem}.feedback{min-height:1.2em;color:#86efac;font-size:.75rem}
    button{font:inherit;color:#eef4ff;cursor:pointer}.primary-button,.secondary-button{width:100%;min-height:42px;border-radius:10px;padding:9px 12px;font-size:.76rem;font-weight:850;border:1px solid #3b82f6;background:#2563eb}
    .secondary-button{background:#22334c;border-color:#3b506e}.primary-button:disabled,.secondary-button:disabled{opacity:.42;cursor:not-allowed}
    .offer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.offer-card{display:flex;flex-direction:column;gap:7px;min-width:0;padding:12px;border:1px solid #263a56;border-radius:12px;background:#111d30}
    .offer-name{font-size:.88rem}.offer-description{margin:0;color:#a9bad0;font-size:.72rem;line-height:1.45}.offer-meta{margin:0;color:#fcd34d;font-size:.7rem;font-weight:800}.offer-card button{margin-top:auto}
    .equipment-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.equipment-card,.inventory-item{padding:10px;border-radius:10px;background:#111d30;display:flex;flex-direction:column;gap:4px}
    .inventory-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.equipment-card strong{font-size:.84rem}.subpanel h2{margin:0 0 10px;font-size:.98rem}
    .dungeon-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.dungeon-card,.floor-card{display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-width:0;padding:12px;border:1px solid #314662;border-radius:13px;background:#111d30;text-align:left}
    .dungeon-card.selected,.floor-card.selected{border-color:#60a5fa;background:linear-gradient(145deg,rgba(30,64,110,.72),#111d30);box-shadow:0 0 0 2px rgba(96,165,250,.16)}
    .dungeon-card:disabled,.floor-card:disabled{opacity:.48;cursor:not-allowed}.dungeon-icon{font-size:1.6rem}.dungeon-name,.floor-name{font-weight:900;font-size:.9rem}.dungeon-meta,.floor-status{color:#93c5fd;font-size:.7rem;font-weight:800}.dungeon-description{color:#a9bad0;font-size:.72rem;line-height:1.45}.dungeon-progress{margin-top:auto;color:#86efac;font-size:.7rem;font-weight:850}
    .floor-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.floor-card{min-height:100px;justify-content:space-between}.boss-note{align-self:flex-end;color:#fda4af;font-size:.68rem;font-weight:900;letter-spacing:.12em}
    .primary-link{display:flex;justify-content:center;align-items:center;width:100%;min-height:48px;margin-top:12px;border-radius:12px;border:1px solid #3b82f6;background:#2563eb;color:#fff;text-decoration:none;font-size:.84rem;font-weight:900}
    @media(max-width:620px){body{padding:10px 8px 20px}.panel,.subpanel{padding:11px;margin:7px 0}.facility-grid{gap:7px}.facility-link{min-height:100px;padding:10px}.offer-grid{gap:7px}.offer-card{padding:10px}.floor-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.dungeon-grid{grid-template-columns:1fr}.inventory-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

    /* Town map: an extra clickable layer that leaves the existing home and nav intact. */
    .town-map-panel .panel-head{margin-bottom:10px}
    .town-map{overflow:hidden;border:1px solid #3a594e;border-radius:13px;background:#183329;box-shadow:inset 0 1px rgba(255,255,255,.04)}
    .town-map svg{display:block;width:100%;height:auto;aspect-ratio:720/480}
    .town-map-spot{cursor:pointer;outline:none}
    .town-map-spot .map-roof{transition:filter .16s ease,stroke .16s ease}
    .town-map-spot:hover .map-roof{filter:brightness(1.18)}
    .town-map-spot:focus-visible .map-hit{stroke:#ffe2a0;stroke-width:4;stroke-dasharray:7 4}
    .town-map-spot .map-label{fill:#f7f2e5;font-size:16px;font-weight:850;text-anchor:middle;paint-order:stroke;stroke:#17251f;stroke-width:3px;stroke-linejoin:round}
    .town-map-spot .map-sub{fill:#e4c987;font-size:10px;font-weight:750;text-anchor:middle}
    .town-map-hint{margin:9px 2px 0;color:#98b4a8;font-size:.72rem;line-height:1.5}
    @media(max-width:420px){.town-map-spot .map-label{font-size:15px}.town-map-spot .map-sub{font-size:9px}}

.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.hero-copy{display:flex;gap:12px;align-items:center}.avatar{display:grid;place-items:center;width:58px;height:58px;border-radius:16px;background:linear-gradient(145deg,#1e4168,#14243b);border:1px solid #416080;font-size:2rem}
.avatar img{display:block;width:100%;height:100%;padding:2px;object-fit:contain}
.hero-name{font-weight:900;font-size:1.05rem}.hero-note{color:#9eacc2;font-size:.74rem;margin-top:4px;line-height:1.4}.record-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.record{padding:10px;border-radius:11px;background:#111d30}.record span{display:block;color:#91a4be;font-size:.66rem}.record strong{display:block;margin-top:4px;font-size:1.12rem}
@media(max-width:520px){.hero{grid-template-columns:1fr}.record-grid{gap:6px}.record{padding:8px 6px}.record strong{font-size:.98rem}}

<body>
<main id="homePage">
  <div class="home-heading">
    <div><div class="eyebrow">WELCOME TO THE TOWN</div><h1>冒険者ギルド</h1></div>
    <span class="home-town-label">はじまりの町</span>
  </div>
  <section class="home-player-panel" aria-label="冒険者の情報">
    <div class="home-player">
      <div class="avatar"><img id="heroAvatar" alt="主人公" hidden></div>
      <div class="home-player-copy">
        <strong>冒険者 <span id="levelValue">LV.1</span></strong>
        <small id="heroMessage">次の冒険に向けて準備しよう。</small>
      </div>
    </div>
    <div class="wallet">
      <div class="stat" id="hpValue">HP 100 / 100</div>
      <div class="stat"><strong id="goldValue">0 G</strong></div>
    </div>
  </section>
  <section class="home-destinations" aria-labelledby="homeDestinationsTitle">
    <div class="home-section-heading"><h2 id="homeDestinationsTitle">どこへ行く？</h2><span>SELECT DESTINATION</span></div>
    <div class="home-choice-grid">
      <a class="home-choice-card home-choice-adventure" href="./dungeons.html">
        <span class="home-choice-icon">⚔️</span><span class="home-choice-copy"><strong>冒険に出る</strong><small>ダンジョンを選択</small></span><span class="home-choice-arrow">›</span>
      </a>
      <a class="home-choice-card home-choice-equipment" href="./inventory.html">
        <span class="home-choice-icon">🛡️</span><span class="home-choice-copy"><strong>装備を整える</strong><small>装備・アイテムを確認</small></span><span class="home-choice-arrow">›</span>
      </a>
      <a class="home-choice-card home-choice-skills" href="./skills.html">
        <span class="home-choice-icon">✨</span><span class="home-choice-copy"><strong>スキル工房</strong><small>スキルを強化</small></span><span class="home-choice-arrow">›</span>
      </a>
      <a class="home-choice-card home-choice-shop" href="./shop.html">
        <span class="home-choice-icon">🛒</span><span class="home-choice-copy"><strong>ショップ</strong><small>武器や道具を購入</small></span><span class="home-choice-arrow">›</span>
      </a>
      <a class="home-choice-card home-choice-forge" href="./crafting.html">
        <span class="home-choice-icon">⚒️</span><span class="home-choice-copy"><strong>鍛冶屋</strong><small>素材から装備を作成</small></span><span class="home-choice-arrow">›</span>
      </a>
    </div>
  </section>
</main>
<script type="module">
import { createAppSession } from "./src/app-session.js";
import { setCharacterImage } from "./src/character-images.js";
setCharacterImage(document.getElementById("heroAvatar"), "hero", { alt: "主人公", baseUrl: document.baseURI });
const session = createAppSession();
const { store, dungeon } = session;
const result = session.returnToTown();
const state = store.getState();
document.getElementById("levelValue").textContent = "LV." + state.player.level;
document.getElementById("hpValue").textContent = "HP " + state.player.hp + " / " + state.player.maxHp;
document.getElementById("goldValue").textContent = state.inventory.gold + " G";
document.getElementById("heroMessage").textContent = result.restoredHp > 0
  ? "ホームに戻ったのでHPが全回復したよ。"
  : "次の冒険に向けて準備しよう。";
window.WFQ_HOME_CONTEXT = {
  player: {
    level: state.player.level,
    hp: state.player.hp,
    maxHp: state.player.maxHp,
  },
  dungeonProgress: dungeon.getAllProgress(),
};
window.addEventListener("pagehide", () => session.save());
</script>
