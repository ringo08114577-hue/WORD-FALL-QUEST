<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>WORD FALL QUEST | 行動ログ</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Noto Sans JP",system-ui,sans-serif;background:#0b1220;color:#eef4ff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:18px 12px 32px;background:radial-gradient(circle at 50% 0%,rgba(56,117,201,.22),transparent 38rem),#0b1220}
    main{width:min(100%,820px);margin:0 auto}
    .topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .eyebrow{color:#7dd3fc;font-size:.68rem;font-weight:850;letter-spacing:.15em}
    .back{color:#bfdbfe;text-decoration:none;font-size:.78rem;font-weight:800}
    h1{margin:8px 0 3px;font-size:clamp(1.65rem,5vw,2.35rem)}
    .subtitle{color:#9eacc2;font-size:.84rem;line-height:1.55;margin:0 0 16px}
    .panel{padding:16px;border:1px solid #29384f;border-radius:16px;background:rgba(18,29,47,.94);margin:10px 0}
    .panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
    h2{font-size:1rem;margin:0}
    .count{color:#93c5fd;font-size:.8rem;font-weight:850;white-space:nowrap}
    .hint{color:#91a4be;font-size:.74rem;line-height:1.5;margin:8px 0 0}
    .log-list{display:grid;gap:8px;margin-top:14px}
    .log-entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:12px;border:1px solid #263a56;border-radius:12px;background:#111d30}
    .log-main{min-width:0}
    .category{display:inline-block;color:#bae6fd;background:#1d3b56;border-radius:99px;padding:3px 8px;font-size:.67rem;font-weight:850}
    .category[data-category="combat"]{color:#fecaca;background:#542a34}
    .category[data-category="skill"]{color:#ddd6fe;background:#3d3265}
    .category[data-category="item"],.category[data-category="equipment"]{color:#fde68a;background:#58451e}
    .category[data-category="reward"]{color:#bbf7d0;background:#1c4b3a}
    .category[data-category="progress"]{color:#bae6fd;background:#21445b}
    .message{margin:7px 0 0;font-size:.86rem;line-height:1.5;overflow-wrap:anywhere}
    time{color:#91a4be;font-size:.7rem;white-space:nowrap;font-variant-numeric:tabular-nums}
    .empty{padding:28px 14px;text-align:center;color:#91a4be;font-size:.84rem;line-height:1.7;border:1px dashed #3b506e;border-radius:12px;margin-top:14px}
    .actions{display:flex;justify-content:flex-end;margin-top:14px}
    button{border:1px solid #8b3542;background:#51242c;color:#fff;border-radius:10px;padding:9px 13px;min-height:40px;font:inherit;font-size:.76rem;font-weight:800;cursor:pointer}
    button:disabled{opacity:.35;cursor:not-allowed}
    .feedback{min-height:1.3em;margin:10px 2px 0;color:#86efac;font-size:.76rem}
    .footer{text-align:center;color:#64748b;font-size:.68rem;margin-top:20px}
    @media(max-width:480px){body{padding:13px 9px 24px}.panel{padding:12px}.log-entry{padding:10px;grid-template-columns:minmax(0,1fr)}time{grid-row:1}.message{font-size:.82rem}}
  </style>
</head>
<body>
<main>
  <div class="topline">
    <div class="eyebrow">WORD FALL QUEST · ADVENTURE RECORD</div>
    <a class="back" href="./index.html">← 冒険者ホーム</a>
  </div>
  <h1>行動ログ</h1>
  <p class="subtitle">冒険中の戦闘・スキル・アイテム・装備・報酬などの履歴を確認できるよ。最新200件まで自動で保存されるよ。</p>
  <section class="panel">
    <div class="panel-head">
      <h2>冒険の記録</h2>
      <span class="count" id="logCount">0件</span>
    </div>
    <p class="hint">新しい行動が上に表示されるよ。ゲームを閉じても、保存されたログは次回起動時に引き継がれるよ。</p>
    <div class="log-list" id="logList" aria-live="polite"></div>
    <div class="actions">
      <button id="clearButton" type="button" disabled>ログをすべて消去</button>
    </div>
    <p class="feedback" id="feedback" aria-live="polite"></p>
  </section>
  <p class="footer">WORD FALL QUEST · ACTION LOG</p>
</main>
<script type="module" src="./src/logs-page.js"></script>
</body>
</html>
