<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09121b"><title>WORD FALL QUEST | キャラクター選択</title>
<link rel="stylesheet" href="./src/shared-layout.css">
<style>
body[data-wfq-page="characters.html"] .wfq-content{padding:12px 14px 30px}
#characterPage{width:min(100%,900px);margin:0 auto;display:grid;gap:13px}
#characterPage .character-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
#characterPage h1{margin:0;color:#f2f4ec;font-size:clamp(1.35rem,4vw,1.85rem)}
#characterPage .eyebrow{margin-bottom:4px;color:#8cc6a5;font-size:.6rem;font-weight:900;letter-spacing:.16em}
#characterPage .character-heading p{margin:5px 0 0;color:#9aadb3;font-size:.7rem}
#characterPage .town-chip{flex:0 0 auto;padding:6px 9px;border:1px solid #526b58;border-radius:8px;color:#d9c38e;background:#1b302b;font-size:.65rem;font-weight:800}
#characterPage .current-character{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid #806b47;border-radius:12px;background:linear-gradient(115deg,#3a3427,#1a2c30 78%)}
#characterPage .current-character-icon{display:grid;place-items:center;flex:0 0 48px;width:48px;height:48px;border-radius:12px;background:#4b4433;font-size:1.8rem}
#characterPage .current-character-copy{display:grid;gap:3px;min-width:0}
#characterPage .current-character-copy small{color:#d4b878;font-size:.6rem;font-weight:900;letter-spacing:.12em}
#characterPage .current-character-copy strong{color:#fff1cf;font-size:.95rem}
#characterPage .current-character-copy p{margin:0;color:#c5c9b9;font-size:.66rem;line-height:1.45}
#characterPage .character-status{margin:0;color:#9db5a9;font-size:.68rem;line-height:1.4}
#characterPage .character-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#characterPage .character-card{display:flex;flex-direction:column;min-width:0;overflow:hidden;border:1px solid #354b56;border-radius:13px;background:linear-gradient(155deg,#1b2d38,#101e29);box-shadow:0 6px 16px rgba(0,0,0,.17)}
#characterPage .character-card.is-selected{border-color:#c5a461;box-shadow:0 0 0 1px rgba(197,164,97,.22),0 8px 18px rgba(0,0,0,.2)}
#characterPage .character-art{display:grid;place-items:center;min-height:100px;background:radial-gradient(circle at 50% 65%,var(--character-accent),transparent 61%),linear-gradient(125deg,#263746,#16232f);border-bottom:1px solid rgba(171,190,184,.13)}
#characterPage .character-art span{display:grid;place-items:center;width:68px;height:68px;border:1px solid var(--character-accent);border-radius:20px;background:#263642;font-size:2.35rem;filter:drop-shadow(0 4px 9px rgba(0,0,0,.28))}
#characterPage .character-card-body{display:flex;flex-direction:column;flex:1;gap:7px;padding:10px}
#characterPage .character-title{color:var(--character-accent);font-size:.58rem;font-weight:900;letter-spacing:.08em}
#characterPage .character-card h2{margin:0;color:#f0f4eb;font-size:.95rem}
#characterPage .character-description{margin:0;color:#c1ccc6;font-size:.67rem;line-height:1.48}
#characterPage .character-detail{display:grid;gap:5px;margin-top:auto;padding-top:5px}
#characterPage .character-detail p{margin:0;color:#9fb0ad;font-size:.61rem;line-height:1.45}
#characterPage .character-detail strong{color:#c5d9c8}
#characterPage .character-select{width:100%;min-height:36px;margin-top:4px;border:1px solid #638b76;border-radius:8px;background:linear-gradient(110deg,#285743,#1d443d);color:#eff8ed;font:inherit;font-size:.69rem;font-weight:900;cursor:pointer}
#characterPage .character-select:disabled{border-color:#806b47;background:#443c2c;color:#f1d89e;cursor:default}
#characterPage .character-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#849b9b;font-size:.62rem}
#characterPage .character-footer a{color:#c8b57e;font-weight:800;text-decoration:none}
@media(max-width:820px){body[data-wfq-page="characters.html"] .wfq-content{padding:8px 9px calc(88px + env(safe-area-inset-bottom))}#characterPage{gap:10px}#characterPage .character-grid{gap:8px}#characterPage .character-card-body{padding:9px}#characterPage .character-art{min-height:86px}}
@media(max-width:360px){#characterPage .character-grid{grid-template-columns:1fr}#characterPage .character-art{min-height:78px}}
</style>
</head>
<body>
<main id="characterPage" aria-label="キャラクター選択">
<header class="character-heading"><div><div class="eyebrow">CHOOSE YOUR STYLE</div><h1>キャラクターを選ぶ</h1><p>4つの戦闘スタイルから、今回の冒険で使うキャラクターを選択。</p></div><span class="town-chip">町で変更可能</span></header>
<section class="current-character" aria-label="現在選択中"><div class="current-character-icon" id="currentCharacterIcon">⚔️</div><div class="current-character-copy"><small>SELECTED CHARACTER</small><strong id="currentCharacterName">轟剣士</strong><p id="currentCharacterDescription">轟気を蓄えて一撃にすべてを込める。</p></div></section>
<p class="character-status" id="characterStatus" role="status" aria-live="polite"></p>
<section class="character-grid" id="characterGrid" aria-label="選択できるキャラクター"></section>
<footer class="character-footer"><span>キャラクター固有の戦闘能力は、順次実装していく予定。</span><a href="./index.html">ホームへ戻る ›</a></footer>
</main>
<script type="module" src="./src/characters-page.js"></script><script type="module" src="./src/shared-layout.js"></script>
</body></html>
