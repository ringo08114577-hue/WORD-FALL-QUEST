<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09121b">
  <title>WORD FALL QUEST | ダンジョン選択</title>
  <link rel="stylesheet" href="./src/shared-layout.css">
  <style>
    body[data-wfq-page="dungeons.html"] .wfq-content {
      padding:12px 14px 32px;
    }
    #dungeonPage {
      width:min(100%,900px);
      margin:0 auto;
      display:flex;
      flex-direction:column;
      gap:13px;
    }
    #dungeonPage .dungeon-page-heading {
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      margin:0 2px;
    }
    #dungeonPage .dungeon-heading-copy {
      display:grid;
      gap:4px;
      min-width:0;
    }
    #dungeonPage .eyebrow {
      color:#73c6a2;
      font-size:.6rem;
      font-weight:900;
      letter-spacing:.15em;
    }
    #dungeonPage h1 {
      margin:0;
      font-size:clamp(1.35rem,4vw,1.9rem);
      line-height:1.18;
    }
    #dungeonPage .dungeon-page-intro {
      margin:0;
      color:#9aadb3;
      font-size:.75rem;
      line-height:1.45;
    }
    #dungeonPage .dungeon-wallet {
      flex:0 0 auto;
      padding:7px 10px;
      border:1px solid #385164;
      border-radius:9px;
      background:#12232e;
      color:#f0d18c;
      font-size:.75rem;
      font-weight:900;
      white-space:nowrap;
    }

    #dungeonPage .dungeon-panel {
      margin:0;
      padding:13px;
      border:1px solid #304957;
      border-radius:14px;
      background:linear-gradient(145deg,rgba(23,42,53,.97),rgba(13,27,38,.98));
      box-shadow:0 8px 22px rgba(0,0,0,.18);
    }
    #dungeonPage .dungeon-panel-heading {
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:10px;
      margin:0 1px 10px;
    }
    #dungeonPage .dungeon-panel-heading h2 {
      margin:0;
      color:#eaf3eb;
      font-size:.98rem;
    }
    #dungeonPage .dungeon-panel-heading span {
      color:#78968c;
      font-size:.55rem;
      font-weight:900;
      letter-spacing:.13em;
    }
    #dungeonPage .dungeon-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
      gap:8px;
    }
    #dungeonPage .dungeon-card {
      position:relative;
      isolation:isolate;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap:10px;
      min-width:0;
      min-height:128px;
      padding:9px;
      overflow:hidden;
      border:1px solid #526b68;
      border-radius:11px;
      background:linear-gradient(145deg,#1a303d,#122430);
      color:#edf4f1;
      text-align:left;
      box-shadow:0 5px 15px rgba(0,0,0,.2);
      transition:border-color .16s ease,transform .16s ease,box-shadow .16s ease;
    }
    #dungeonPage .dungeon-card:hover {
      transform:translateY(-1px);
      border-color:#8ac9a7;
    }
    #dungeonPage .dungeon-card.selected {
      border-color:#8be0ad;
      box-shadow:inset 0 0 0 1px rgba(139,224,173,.45),0 0 0 2px rgba(92,191,135,.22),0 7px 17px rgba(0,0,0,.24);
    }
    #dungeonPage .dungeon-card:focus-visible,
    #dungeonPage .floor-card:focus-visible {
      outline:2px solid #9adbb5;
      outline-offset:2px;
    }
    #dungeonPage .dungeon-card-art,
    #dungeonPage .dungeon-card-shade {
      position:absolute;
      z-index:-1;
      inset:0;
      display:block;
      width:100%;
      height:100%;
    }
    #dungeonPage .dungeon-card-art img {
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      transition:transform .3s ease;
    }
    #dungeonPage .dungeon-card:hover .dungeon-card-art img {
      transform:scale(1.035);
    }
    #dungeonPage .dungeon-card-shade {
      background:linear-gradient(180deg,rgba(5,15,20,.48) 0%,rgba(5,15,20,.08) 40%,rgba(5,15,20,.78) 100%);
    }
    #dungeonPage .dungeon-card-head {
      display:flex;
      align-items:center;
      gap:7px;
      min-width:0;
      padding:4px 6px;
      border:1px solid rgba(232,235,218,.2);
      border-radius:8px;
      background:rgba(7,17,22,.52);
      backdrop-filter:blur(3px);
    }
    #dungeonPage .dungeon-icon {
      display:grid;
      place-items:center;
      flex:0 0 25px;
      width:25px;
      height:25px;
      border-radius:7px;
      background:rgba(7,19,26,.48);
      font-size:1.05rem;
    }
    #dungeonPage .dungeon-name {
      min-width:0;
      color:#fff9e9;
      font-size:.79rem;
      font-weight:950;
      line-height:1.2;
      text-shadow:0 2px 5px rgba(0,0,0,.8);
      overflow-wrap:anywhere;
    }
    #dungeonPage .dungeon-card-footer {
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:4px;
    }
    #dungeonPage .dungeon-meta,
    #dungeonPage .dungeon-progress {
      display:inline-flex;
      align-items:center;
      min-height:20px;
      max-width:100%;
      padding:3px 7px;
      border:1px solid rgba(226,237,222,.16);
      border-radius:999px;
      background:rgba(5,17,23,.68);
      color:#e4f1df;
      font-size:.59rem;
      font-weight:900;
      line-height:1.2;
      text-shadow:0 1px 3px rgba(0,0,0,.7);
    }
    #dungeonPage .dungeon-progress {
      border-color:rgba(230,198,120,.3);
      color:#ffe4a3;
    }

    #dungeonPage .floor-panel {
      position:relative;
      isolation:isolate;
      overflow:hidden;
      padding-bottom:14px;
      border-color:#3b584e;
      background-color:#102b26;
      background-image:linear-gradient(110deg,rgba(9,31,25,.98) 0%,rgba(10,32,27,.92) 52%,rgba(10,32,27,.68) 100%),url("./assets/dungeons/forest-ruins.svg");
      background-size:cover;
      background-position:center;
      transition:border-color .2s ease,background-image .2s ease;
    }
    #dungeonPage[data-dungeon-theme="ice"] .floor-panel {
      border-color:#477e9c;
      background-color:#0c2740;
      background-image:linear-gradient(110deg,rgba(7,25,48,.98) 0%,rgba(9,39,65,.92) 52%,rgba(9,39,65,.66) 100%),url("./assets/dungeons/frozen-cavern.svg");
      background-position:center;
    }
    #dungeonPage[data-dungeon-theme="forest"] .floor-panel {
      border-color:#477557;
    }
    #dungeonPage[data-dungeon-theme="forest"] #selectedDungeonName {
      border-color:#5e9168;
      background:rgba(24,67,45,.9);
      color:#e0f5d8;
    }
    #dungeonPage[data-dungeon-theme="ice"] #selectedDungeonName {
      border-color:#5b9fbc;
      background:rgba(19,65,99,.9);
      color:#d9f5ff;
    }
    #dungeonPage[data-dungeon-theme="ice"] #selectedFloorLabel {
      color:#a9eaff;
    }
    #dungeonPage .floor-panel-top {
      display:flex;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:7px;
      margin-bottom:8px;
    }
    #dungeonPage #selectedDungeonName {
      display:inline-flex;
      align-items:center;
      min-height:29px;
      padding:5px 9px;
      border:1px solid #486a5b;
      border-radius:7px;
      background:#16372f;
      color:#d4edda;
      font-size:.72rem;
      font-weight:900;
    }
    #dungeonPage #selectedFloorLabel {
      color:#e5c77f;
      font-size:.68rem;
      font-weight:850;
    }
    #dungeonPage #floorHeading {
      margin:0 0 4px;
      color:#eff5eb;
      font-size:.98rem;
    }
    #dungeonPage #floorHint {
      margin:0 0 11px;
      color:#94aaa8;
      font-size:.66rem;
      line-height:1.45;
    }
    #dungeonPage .floor-grid {
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:7px;
    }
    #dungeonPage .floor-card {
      position:relative;
      isolation:isolate;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:5px;
      min-width:0;
      min-height:76px;
      padding:7px 3px;
      overflow:hidden;
      border:1px solid #426b50;
      border-radius:9px;
      background:linear-gradient(145deg,rgba(36,75,51,.94),rgba(14,42,37,.96));
      color:#eaf2ed;
      text-align:center;
      box-shadow:inset 0 1px rgba(255,255,255,.05),0 3px 9px rgba(0,0,0,.16);
      transition:transform .15s ease,border-color .15s ease,background .15s ease,box-shadow .15s ease;
    }
    #dungeonPage .floor-card::before {
      position:absolute;
      z-index:-1;
      inset:0;
      background:linear-gradient(135deg,rgba(165,222,150,.11),transparent 58%);
      content:"";
      pointer-events:none;
    }
    #dungeonPage .floor-card:not(:disabled):hover {
      transform:translateY(-1px);
      border-color:#a4d58d;
    }
    #dungeonPage .floor-card.selected {
      border-color:#b5e68e;
      background:linear-gradient(145deg,#39794d,#1c493e);
      box-shadow:inset 0 0 0 1px rgba(201,239,161,.24),0 0 0 2px rgba(128,198,112,.18),0 5px 12px rgba(0,0,0,.22);
    }
    #dungeonPage .floor-card.floor-card--cleared {
      border-color:#52785c;
    }
    #dungeonPage .floor-card.floor-card--locked {
      border-color:#35474a;
      background:linear-gradient(145deg,rgba(30,43,47,.88),rgba(16,29,35,.94));
      filter:saturate(.55);
    }
    #dungeonPage .floor-card.floor-card--boss {
      border-color:#a77d4d;
      background:linear-gradient(145deg,rgba(83,57,39,.96),rgba(39,34,35,.98));
    }
    #dungeonPage .floor-card.floor-card--boss::before {
      background:linear-gradient(135deg,rgba(255,207,128,.16),transparent 62%);
    }
    #dungeonPage .floor-card.floor-card--boss.selected {
      border-color:#f0c875;
      background:linear-gradient(145deg,#76552e,#3e3a32);
      box-shadow:inset 0 0 0 1px rgba(255,226,159,.22),0 0 0 2px rgba(221,173,96,.2);
    }
    #dungeonPage[data-dungeon-theme="ice"] .floor-card {
      border-color:#397b9e;
      background:linear-gradient(145deg,rgba(27,91,132,.95),rgba(12,43,76,.97));
      box-shadow:inset 0 1px rgba(255,255,255,.08),0 3px 9px rgba(0,0,0,.18);
    }
    #dungeonPage[data-dungeon-theme="ice"] .floor-card::before {
      background:linear-gradient(135deg,rgba(184,244,255,.18),transparent 58%);
    }
    #dungeonPage[data-dungeon-theme="ice"] .floor-card:not(:disabled):hover {
      border-color:#a6eaff;
    }
    #dungeonPage[data-dungeon-theme="ice"] .floor-card.selected {
      border-color:#baf2ff;
      background:linear-gradient(145deg,#287ba7,#17466f);
      box-shadow:inset 0 0 0 1px rgba(205,249,255,.25),0 0 0 2px rgba(91,196,235,.2),0 5px 12px rgba(0,0,0,.22);
    }
    #dungeonPage[data-dungeon-theme="ice"] .floor-card.floor-card--cleared {
      border-color:#4c91b3;
    }
    #dungeonPage[data-dungeon-theme="ice"] .floor-card.floor-card--locked {
      border-color:#344e62;
      background:linear-gradient(145deg,rgba(24,44,60,.9),rgba(12,29,46,.95));
    }
    #dungeonPage[data-dungeon-theme="ice"] .floor-card.floor-card--boss {
      border-color:#a77e91;
      background:linear-gradient(145deg,rgba(77,52,84,.96),rgba(33,36,62,.98));
    }
    #dungeonPage[data-dungeon-theme="ice"] .floor-card.floor-card--boss.selected {
      border-color:#e2c2e9;
      background:linear-gradient(145deg,#674b86,#304b75);
      box-shadow:inset 0 0 0 1px rgba(240,222,255,.2),0 0 0 2px rgba(192,152,224,.2);
    }
    #dungeonPage .floor-card:disabled {
      opacity:.58;
      cursor:not-allowed;
    }
    #dungeonPage .floor-name {
      color:#f3f8e9;
      font-size:.79rem;
      font-weight:950;
      line-height:1.2;
      text-shadow:0 1px 4px rgba(0,0,0,.3);
    }
    #dungeonPage .floor-status {
      color:#c3dfba;
      font-size:.55rem;
      font-weight:800;
      line-height:1.3;
      overflow-wrap:anywhere;
    }
    #dungeonPage[data-dungeon-theme="ice"] .floor-status {
      color:#c5efff;
    }
    #dungeonPage .floor-card--locked .floor-status {
      color:#aab7b5;
    }
    #dungeonPage .boss-note {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:32px;
      padding:2px 6px;
      border:1px solid rgba(255,213,139,.42);
      border-radius:999px;
      background:rgba(48,33,24,.72);
      color:#ffdda0;
      font-size:.5rem;
      font-weight:950;
      letter-spacing:.1em;
    }
    #dungeonPage[data-dungeon-theme="ice"] .boss-note {
      border-color:rgba(229,199,255,.48);
      background:rgba(44,39,77,.78);
      color:#efd9ff;
    }
    #dungeonPage .primary-link {
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
      min-height:47px;
      margin-top:11px;
      padding:10px 14px;
      border:1px solid #55b58b;
      border-radius:10px;
      background:linear-gradient(180deg,#278d69,#176a51);
      color:#f4fff7;
      font-size:.82rem;
      font-weight:950;
      text-decoration:none;
      box-shadow:0 5px 14px rgba(13,83,59,.28),inset 0 1px rgba(255,255,255,.12);
    }
    #dungeonPage .primary-link:active { transform:translateY(1px); }
    #dungeonPage .feedback {
      min-height:1.2em;
      margin:0 2px;
      color:#9ae0b2;
      font-size:.68rem;
      line-height:1.4;
    }
    #dungeonPage .dungeon-footer {
      margin:0;
      color:#657f80;
      font-size:.58rem;
      text-align:center;
      letter-spacing:.08em;
    }

    @media(max-width:820px) {
      body[data-wfq-page="dungeons.html"] .wfq-content {
        padding:8px 9px calc(88px + env(safe-area-inset-bottom));
      }
      #dungeonPage { gap:9px; }
      #dungeonPage .dungeon-panel { padding:10px; }
      #dungeonPage .dungeon-grid { gap:7px; }
      #dungeonPage .dungeon-grid { grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:7px; }
      #dungeonPage .dungeon-card { min-height:116px; padding:8px; }
      #dungeonPage .floor-grid { gap:5px; }
      #dungeonPage .floor-card { min-height:70px; }
    }
    @media(max-width:380px) {
      #dungeonPage .dungeon-page-heading { align-items:center; }
      #dungeonPage .dungeon-page-intro { max-width:230px; font-size:.68rem; }
      #dungeonPage .dungeon-wallet { padding:6px 8px; font-size:.68rem; }
      #dungeonPage .dungeon-card { min-height:108px; padding:7px; }
      #dungeonPage .dungeon-name { font-size:.72rem; }
      #dungeonPage .dungeon-meta,#dungeonPage .dungeon-progress { font-size:.53rem; }
      #dungeonPage .dungeon-name { font-size:.76rem; }
      #dungeonPage .dungeon-meta,#dungeonPage .dungeon-progress { font-size:.56rem; }
      #dungeonPage .floor-grid { gap:4px; }
      #dungeonPage .floor-card { min-height:68px; padding:6px 2px; }
      #dungeonPage .floor-name { font-size:.7rem; }
      #dungeonPage .floor-status { font-size:.49rem; }
    }
    @media(prefers-reduced-motion:reduce) {
      #dungeonPage .dungeon-card,#dungeonPage .floor-card { transition:none; }
    }
  </style>
</head>
<body>
  <main id="dungeonPage">
    <header class="dungeon-page-heading">
      <div class="dungeon-heading-copy">
        <div class="eyebrow">WORD FALL QUEST · DUNGEON GATE</div>
        <h1>冒険の目的地</h1>
        <p class="dungeon-page-intro">行き先を選び、挑戦する階層を決めよう。</p>
      </div>
      <div class="dungeon-wallet" id="goldValue">0 G</div>
    </header>

    <section class="panel dungeon-panel" aria-labelledby="dungeonListTitle">
      <div class="dungeon-panel-heading">
        <h2 id="dungeonListTitle">ダンジョンを選ぶ</h2>
        <span>SELECT AREA</span>
      </div>
      <div class="dungeon-grid" id="dungeonGrid"></div>
    </section>

    <section class="panel dungeon-panel floor-panel" aria-labelledby="floorHeading">
      <div class="floor-panel-top">
        <div class="stat" id="selectedDungeonName">ダンジョン</div>
        <span id="selectedFloorLabel">1階を選択中</span>
      </div>
      <h2 id="floorHeading">階層選択</h2>
      <p class="muted" id="floorHint"></p>
      <div class="floor-grid" id="floorGrid"></div>
      <a class="primary-link" id="adventureButton" href="./battle.html">選んだ階層へ進む →</a>
    </section>

    <p class="feedback" id="feedback" aria-live="polite"></p>
    <p class="dungeon-footer">WORD FALL QUEST · DUNGEON SELECT</p>
  </main>

  <script type="module" src="./src/dungeons-page.js"></script>
  <script type="module" src="./src/shared-layout.js"></script>
</body>
</html>
